[project]
name = "pcc-devops-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6,<7"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
